<!DOCTYPE html>
<html lang="pl" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BufetCost · F&B P&L Analytics</title>
<meta name="application-name" content="BufetCost">
<meta name="description" content="Analiza kosztów i przychodów bufetu hotelowego (śniadania, kolacje)">
<meta name="theme-color" content="#0d0b1f" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BufetCost">
<link rel="icon" id="pwa-favicon">
<link rel="apple-touch-icon" id="pwa-apple-icon">
<link rel="manifest" id="pwa-manifest">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS — "Aurora" theme
   bg: deep indigo-violet · signature: gradient rings (violet→coral→pink)
═══════════════════════════════════════════════════════ */
:root{
  --bg:#0d0b1f;--bg2:#120f2b;--bg-rgb:13,11,31;
  --sur:#171433;--sur2:#1e1a42;--sur3:#262052;
  --brd:#2c2560;--brd2:#3a316f;
  --violet:#7c6cf0;--pink:#ff6fa5;--coral:#ff8c66;--teal:#22d3ee;--amber:#f6b93b;
  --grn:#34d399;--red:#fb6f92;--warn:#f6b93b;
  --acc:#7c6cf0;--acc-rgb:124,108,240;--acc-glow:rgba(124,108,240,.18);
  --tx:#f1eefc;--tx2:#a79cd1;--tx3:#6c62a0;
  --g-aurora:linear-gradient(135deg,#7c6cf0 0%,#c866ea 45%,#ff6fa5 100%);
  --g-teal:linear-gradient(135deg,#22d3ee 0%,#7c6cf0 100%);
  --g-warm:linear-gradient(135deg,#f6b93b 0%,#ff8c66 55%,#ff6fa5 100%);
  --g-cool:linear-gradient(135deg,#22d3ee 0%,#7c6cf0 55%,#c866ea 100%);
  --bgglow1:rgba(124,108,240,.20);--bgglow2:rgba(255,111,165,.14);
  --color-scheme:dark;
  --fd:'Outfit',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
  --r:16px;--r-sm:10px;
}

/* ═══ THEME: Neon (dark variant — navy/black, cyan+magenta) ═══ */
html[data-theme="neon"]{
  --bg:#080a14;--bg2:#0c1020;--bg-rgb:8,10,20;
  --sur:#10141f;--sur2:#161c2c;--sur3:#1e2638;
  --brd:#232c40;--brd2:#2e3954;
  --violet:#5b6cff;--pink:#ff2fb0;--coral:#ff8a3d;--teal:#00d9ff;--amber:#ffd43b;
  --grn:#2dd4bf;--red:#ff4d7d;--warn:#ffd43b;
  --acc:#00d9ff;--acc-rgb:0,217,255;--acc-glow:rgba(0,217,255,.18);
  --tx:#eef3fb;--tx2:#8a93b8;--tx3:#565e82;
  --g-aurora:linear-gradient(135deg,#00d9ff 0%,#5b6cff 55%,#ff2fb0 100%);
  --g-teal:linear-gradient(135deg,#00d9ff 0%,#5b6cff 100%);
  --g-warm:linear-gradient(135deg,#ffd43b 0%,#ff8a3d 55%,#ff2fb0 100%);
  --g-cool:linear-gradient(135deg,#00d9ff 0%,#5b6cff 55%,#ff2fb0 100%);
  --bgglow1:rgba(0,217,255,.16);--bgglow2:rgba(255,47,176,.12);
  --color-scheme:dark;
}
/* ═══ THEME: Daylight (light — lavender/white, violet+pink+coral) ═══ */
html[data-theme="daylight"]{
  --bg:#f5f4fb;--bg2:#efeefa;--bg-rgb:245,244,251;
  --sur:#ffffff;--sur2:#f4f2fc;--sur3:#eae6f9;
  --brd:#e1ddf3;--brd2:#cdc5ec;
  --violet:#6d5ef2;--pink:#e0518c;--coral:#ea6a3f;--teal:#0a8aa8;--amber:#c96a12;
  --grn:#0f9d68;--red:#d43a5f;--warn:#c96a12;
  --acc:#6d5ef2;--acc-rgb:109,94,242;--acc-glow:rgba(109,94,242,.14);
  --tx:#221c3d;--tx2:#5c5480;--tx3:#8d85ac;
  --g-aurora:linear-gradient(135deg,#6d5ef2 0%,#a855d6 45%,#e0518c 100%);
  --g-teal:linear-gradient(135deg,#0a8aa8 0%,#6d5ef2 100%);
  --g-warm:linear-gradient(135deg,#c96a12 0%,#ea6a3f 55%,#e0518c 100%);
  --g-cool:linear-gradient(135deg,#0a8aa8 0%,#6d5ef2 55%,#a855d6 100%);
  --bgglow1:rgba(109,94,242,.10);--bgglow2:rgba(224,81,140,.08);
  --color-scheme:light;
}
/* ═══ THEME: Arctic (light — cool blue-gray/white, blue+teal) ═══ */
html[data-theme="arctic"]{
  --bg:#f2f6fa;--bg2:#eaf1f6;--bg-rgb:242,246,250;
  --sur:#ffffff;--sur2:#eef3f7;--sur3:#dfe9f0;
  --brd:#d6e2ea;--brd2:#bcd0dd;
  --violet:#2f6fed;--pink:#0eaab8;--coral:#e2883b;--teal:#0891b2;--amber:#c68a1f;
  --grn:#0e9f6e;--red:#d5474d;--warn:#c68a1f;
  --acc:#2f6fed;--acc-rgb:47,111,237;--acc-glow:rgba(47,111,237,.14);
  --tx:#152531;--tx2:#4d6473;--tx3:#7f97a4;
  --g-aurora:linear-gradient(135deg,#2f6fed 0%,#0eaab8 60%,#0891b2 100%);
  --g-teal:linear-gradient(135deg,#0891b2 0%,#2f6fed 100%);
  --g-warm:linear-gradient(135deg,#c68a1f 0%,#e2883b 55%,#0eaab8 100%);
  --g-cool:linear-gradient(135deg,#0891b2 0%,#2f6fed 55%,#0eaab8 100%);
  --bgglow1:rgba(47,111,237,.08);--bgglow2:rgba(14,170,184,.08);
  --color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;-webkit-font-smoothing:antialiased;height:100%}
body{
  color-scheme:var(--color-scheme);
  background:var(--bg);
  background-image:radial-gradient(ellipse 900px 500px at 15% -10%,var(--bgglow1),transparent 60%),
                    radial-gradient(ellipse 700px 500px at 110% 10%,var(--bgglow2),transparent 60%);
  background-attachment:fixed;
  color:var(--tx);font-family:var(--fb);min-height:100%;overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--fd)}
button{cursor:pointer;font-family:var(--fb);touch-action:manipulation;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--fb)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
a{color:var(--violet)}

/* ═══ LAYOUT ═══ */
#app{display:flex;min-height:100vh}
#sidebar{
  width:236px;min-height:100vh;background:var(--sur);border-right:1px solid var(--brd);
  display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:200;
  transition:transform .25s ease;overflow-y:auto;
}
#main{margin-left:236px;flex:1;padding:20px 22px 56px;min-height:100vh;max-width:1440px}
body.entry-active #main{padding-bottom:110px}
@media(max-width:768px){
  html{height:100vh;height:100dvh}
  body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  #app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
  #sidebar{transform:translateX(-100%);width:270px}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px));min-width:0;max-width:100%}
  body.entry-active #main{padding-bottom:calc(162px + env(safe-area-inset-bottom,0px))}
  #bottom-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;z-index:180;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
}
#overlay{position:fixed;inset:0;background:rgba(5,3,15,.6);z-index:190;display:none;backdrop-filter:blur(2px)}
#overlay.on{display:block}
.view-end-spacer{height:36px;flex-shrink:0}
@media(max-width:768px){.view-end-spacer{height:56px}}

#bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:180;
  background:var(--sur);border-top:1px solid var(--brd);height:60px;align-items:stretch;
}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.58rem;color:var(--tx3);padding:6px 2px;transition:color .15s}
.bnav-item.active{color:var(--pink)}
.bnav-item svg{width:20px;height:20px;flex-shrink:0}

/* ═══ SIDEBAR ═══ */
.s-logo{padding:20px 18px 14px;border-bottom:1px solid var(--brd);flex-shrink:0}
.s-logo h1{font-size:1.15rem;letter-spacing:.02em;line-height:1.2;
  background:var(--g-aurora);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.s-logo span{font-size:.6rem;color:var(--tx3);font-family:var(--fb);letter-spacing:.14em;text-transform:uppercase}
.s-sect{padding:14px 16px 6px;font-size:.6rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.s-sel{padding:6px 16px 10px}
.s-sel label{font-size:.6rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:4px}
.s-input{width:100%;background:var(--sur2);border:1px solid var(--brd2);color:var(--tx);border-radius:8px;padding:7px 9px;font-size:.8rem;outline:none;-webkit-appearance:none}
.s-input:focus{border-color:var(--violet)}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:var(--tx2);border-left:2px solid transparent;transition:all .15s}
.nav-i:hover{background:var(--sur2);color:var(--tx)}
.nav-i.active{background:linear-gradient(90deg,rgba(124,108,240,.18),transparent);color:var(--tx);border-left-color:var(--pink);font-weight:600}
.nav-i svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.nav-i.active svg{opacity:1}
.s-bottom{padding:12px 16px;border-top:1px solid var(--brd);margin-top:auto;flex-shrink:0}
.install-btn{width:100%;padding:9px;border-radius:10px;background:var(--g-aurora);color:#fff;font-size:.75rem;font-weight:600;text-align:center;margin-bottom:8px}
.s-foot-note{font-size:.6rem;color:var(--tx3);text-align:center;line-height:1.4}

/* ═══ TOPBAR ═══ */
#topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#hamburger{width:38px;height:38px;background:var(--sur);border:1px solid var(--brd);border-radius:10px;display:none;align-items:center;justify-content:center;color:var(--tx);flex-shrink:0}
@media(max-width:768px){#hamburger{display:flex}}
.page-title{font-size:1.4rem;font-family:var(--fd);font-weight:700;flex:1;min-width:0}
.page-sub{font-size:.72rem;color:var(--tx3);margin-top:1px}
.top-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* ═══ CARDS / KPI ═══ */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--g-aurora)}
.kpi.warm::before{background:var(--g-warm)}
.kpi.cool::before{background:var(--g-cool)}
.kpi-lbl{font-size:.63rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kpi-val{font-family:var(--fm);font-size:1.3rem;font-weight:600;line-height:1.1}
.kpi-sub{font-size:.68rem;color:var(--tx3);margin-top:4px}
.kpi-ch{font-size:.68rem;font-weight:600;margin-top:3px}
.kpi-ch.pos{color:var(--grn)}
.kpi-ch.neg{color:var(--red)}

.stitle{font-family:var(--fd);font-size:.95rem;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.stitle small{font-size:.68rem;color:var(--tx3);font-weight:400;font-family:var(--fb)}

/* section color coding */
.sec-b{border-left:3px solid var(--amber)}
.sec-d{border-left:3px solid var(--violet)}
.sec-t{border-left:3px solid var(--teal)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sur2);color:var(--tx2);border:1px solid var(--brd2)}
.badge.up{color:var(--grn);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}
.badge.dn{color:var(--red);background:rgba(251,111,146,.1);border-color:rgba(251,111,146,.25)}

/* ═══ RING (signature element) ═══ */
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--sur3);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-val b{font-family:var(--fm);font-size:1.15rem}
.ring-val span{font-size:.55rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

/* ═══ BUTTONS ═══ */
.btn{padding:8px 14px;border-radius:10px;font-size:.8rem;font-weight:600;background:var(--sur2);border:1px solid var(--brd2);color:var(--tx)}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--g-aurora);color:#fff;border:none}
.btn.danger{background:rgba(251,111,146,.12);color:var(--red);border-color:rgba(251,111,146,.3)}
.btn.sm{padding:5px 10px;font-size:.72rem}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--sur2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{color:var(--tx);border-color:var(--violet)}

/* ═══ FORMS ═══ */
.field{margin-bottom:12px}
.field label{font-size:.72rem;color:var(--tx2);display:block;margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;background:var(--sur2);border:1px solid var(--brd2);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:.88rem;outline:none;font-family:var(--fm)}
.field input:focus,.field select:focus{border-color:var(--violet)}
.field .hint{font-size:.65rem;color:var(--tx3);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.frow{grid-template-columns:1fr 1fr}}

/* ═══ TABS ═══ */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;font-size:.78rem;font-weight:600;background:var(--sur2);border:1px solid var(--brd2);color:var(--tx2)}
.tab.on{background:var(--g-aurora);color:#fff;border:none}

/* ═══ TABLE ═══ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--brd);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.76rem;white-space:nowrap}
th{background:var(--sur2);color:var(--tx3);text-align:left;padding:8px 10px;font-weight:600;text-transform:uppercase;font-size:.62rem;letter-spacing:.04em;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--brd);font-family:var(--fm)}
tr.day-empty td{color:var(--tx3);opacity:.5}
tr:hover td{background:var(--sur2)}
.td-pos{color:var(--grn)}
.td-neg{color:var(--red)}

/* ═══ DAY PICKER ═══ */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day-cell{aspect-ratio:1;border-radius:9px;background:var(--sur2);border:1px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-family:var(--fm);color:var(--tx2);position:relative}
.day-cell.filled{background:rgba(124,108,240,.15);border-color:var(--violet);color:var(--tx)}
.day-cell.active{background:var(--g-aurora);color:#fff;border:none;font-weight:700}
.day-cell.filled::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--teal)}
.day-cell.active::after{display:none}

/* ═══ EMPTY / TOAST ═══ */
.empty{text-align:center;padding:50px 20px;color:var(--tx3)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.4}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sur2);border:1px solid var(--brd2);color:var(--tx);padding:10px 18px;border-radius:12px;font-size:.8rem;z-index:400;opacity:0;transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(52,211,153,.4)}
#toast.err{border-color:rgba(251,111,146,.4)}
@media(min-width:769px){#toast{bottom:24px}}

.chart-box{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.chart-box canvas{max-height:260px}

/* ═══ STICKY SAVE BAR (entry view) ═══ */
#entry-savebar{position:fixed;left:236px;right:0;bottom:0;z-index:150;padding:14px 22px;
  background:linear-gradient(180deg,rgba(var(--bg-rgb),0),rgba(var(--bg-rgb),.85) 35%,var(--bg) 65%);
  display:none;justify-content:flex-end;pointer-events:none}
#entry-savebar.on{display:flex}
#entry-savebar .btn{pointer-events:auto;box-shadow:0 10px 30px rgba(124,108,240,.35)}
@media(max-width:768px){
  #entry-savebar{left:0;bottom:60px;padding:10px 12px}
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

.pill-select{display:flex;gap:6px;background:var(--sur2);border:1px solid var(--brd2);border-radius:12px;padding:3px}
.pill-select button{flex:1;padding:6px 0;border-radius:9px;font-size:.75rem;font-weight:600;color:var(--tx2)}
.pill-select button.on{background:var(--g-aurora);color:#fff}

.propcard{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.propcard b{font-family:var(--fd);font-size:.95rem}
.propcard .meta{font-size:.68rem;color:var(--tx3);margin-top:2px}

/* ═══ THEME PICKER ═══ */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.theme-swatch{border:2px solid var(--brd);border-radius:14px;padding:10px;cursor:pointer;background:var(--sur2);transition:border-color .15s}
.theme-swatch.on{border-color:var(--violet);box-shadow:0 0 0 3px var(--acc-glow)}
.theme-swatch .tsw-preview{height:44px;border-radius:9px;margin-bottom:8px;position:relative;overflow:hidden}
.theme-swatch .tsw-preview i{position:absolute;bottom:5px;left:5px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9)}
.theme-swatch .tsw-name{font-size:.8rem;font-weight:700;font-family:var(--fd)}
.theme-swatch .tsw-kind{font-size:.62rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.theme-swatch.on .tsw-name{color:var(--violet)}

/* ═══ PROGRESS BAR ═══ */
.progress{height:8px;border-radius:5px;background:var(--sur3);overflow:hidden;position:relative}
.progress i{display:block;height:100%;border-radius:5px;background:var(--g-aurora);transition:width .4s ease}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.progress-row .progress{flex:1}
.progress-lbl{font-size:.68rem;color:var(--tx3);white-space:nowrap;font-family:var(--fm)}

/* ═══ STICKY FIRST COLUMN ═══ */
.tbl-wrap table th:first-child,.tbl-wrap table td:first-child{position:sticky;left:0;z-index:3;background:var(--sur2);box-shadow:2px 0 4px rgba(0,0,0,.15)}
.tbl-wrap table th:first-child{z-index:4}
.tbl-wrap table tr:hover td:first-child{background:var(--sur3)}
tr.day-empty td:first-child{background:var(--sur2)}
tr.day-outlier td{background:rgba(251,111,146,.06)}
tr.day-outlier td:first-child{background:rgba(251,111,146,.14)}

/* ═══ CHECK ROW (personalization / widget toggles) ═══ */

function lsGet(k,def){try{var v=localStorage.getItem(LS_PREFIX+k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(LS_PREFIX+k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){localStorage.removeItem(LS_PREFIX+k)}
function lsKeys(prefix){return Object.keys(localStorage).filter(function(k){return k.indexOf(LS_PREFIX+prefix)===0}).map(function(k){return k.slice(LS_PREFIX.length)})}

/* ═══ CONNECTION STATUS (Firestore sync feedback) ═══ */
var _pendingWrites=0;
function setConnStatus(status){
  window._connStatus=status;
  var el=document.getElementById('conn-status');
  if(!el)return;
  var labels={online:'Online',offline:'Offline — dane lokalne',syncing:'Synchronizacja...'};
  el.className='conn-dot '+status;
  el.innerHTML='<i></i>'+(labels[status]||status);
}
function connBeginWrite(){_pendingWrites++;setConnStatus('syncing')}
function connEndWrite(ok){
  _pendingWrites=Math.max(0,_pendingWrites-1);
  if(_pendingWrites===0)setConnStatus(navigator.onLine?'online':'offline');
}
function fsWrite(ref,data,merge){
  if(!S.uid||!db)return;
  connBeginWrite();
  ref.set(data,merge?{merge:true}:undefined).then(function(){connEndWrite(true)}).catch(function(){connEndWrite(false)});
}
function fsDelete(ref){
  if(!S.uid||!db)return;
  connBeginWrite();
  ref.delete().then(function(){connEndWrite(true)}).catch(function(){connEndWrite(false)});
}
window.addEventListener('online',function(){if(_pendingWrites===0)setConnStatus('online')});
window.addEventListener('offline',function(){setConnStatus('offline')});

/* ---- Properties (top-level Firestore collection, shared via memberEmails) ---- */
function getProps(){return lsGet('properties',[])}
function saveProps(a){lsSet('properties',a)}
function addProperty(name){
  var id='p'+Date.now();
  var p={id:id,name:name,ownerEmail:S.userEmailLower,memberEmails:[S.userEmailLower],
    members:[{email:S.userEmailLower,role:'admin'}],targetFb:30,createdAt:Date.now()};
  var a=getProps();a.push(p);saveProps(a);
  if(S.uid)fsWrite(db.collection('properties').doc(id),p);
  return id;
}
function updatePropertyLocal(p){
  var a=getProps();var i=a.findIndex(function(x){return x.id===p.id});
  if(i>=0)a[i]=p;else a.push(p);
  saveProps(a);
}
function renameProperty(id,name){
  var a=getProps();var p=a.find(function(x){return x.id===id});
  if(p){p.name=name;saveProps(a);if(S.uid)fsWrite(db.collection('properties').doc(id),{name:name},true);}
}
function deleteProperty(id){
  var a=getProps().filter(function(x){return x.id!==id});saveProps(a);
  lsKeys('day-'+id+'-').forEach(function(k){lsDel(k)});
  lsKeys('meta-'+id+'-').forEach(function(k){lsDel(k)});
  if(S.uid)fsDelete(db.collection('properties').doc(id));
}

/* ---- Roles & permissions ---- */
function getMyRole(prop){
  if(!prop)return null;
  if(prop.ownerEmail&&prop.ownerEmail===S.userEmailLower)return 'admin';
  var m=(prop.members||[]).find(function(x){return x.email===S.userEmailLower});
  return m?m.role:null;
}
function refreshCurrentRole(){
  var prop=S.props.find(function(p){return p.id===S.pid});
  S.currentRole=getMyRole(prop)||(prop?'viewer':null);
}
function canEdit(){return S.currentRole==='admin'||S.currentRole==='manager'}
function canManageTeam(){return S.currentRole==='admin'}
function inviteMemberToProperty(pid,email,role){
  var lower=(email||'').trim().toLowerCase();
  if(!lower||lower.indexOf('@')===-1)return {ok:false,msg:'Podaj prawidłowy adres email'};
  var a=getProps();var prop=a.find(function(x){return x.id===pid});
  if(!prop)return {ok:false,msg:'Nie znaleziono obiektu'};
  prop.members=prop.members||[{email:prop.ownerEmail,role:'admin'}];
  prop.memberEmails=prop.memberEmails||[prop.ownerEmail];
  if(prop.memberEmails.indexOf(lower)!==-1)return {ok:false,msg:'Ta osoba już ma dostęp'};

/* ═══════════════════════════════════════════════════════
   CALC ENGINE — mirrors the Excel workbook formulas exactly:
   Śniadania / Kolacje sections carry running (narastająco) sums;
   Śniadania+Kolacje section is fully derived; bottom summary
   uses the manual monthly labor input.
═══════════════════════════════════════════════════════ */
function calcMonth(pid,ym){
  var n=dim(ym);
  var cum={bG:0,bC:0,bR:0, dG:0,dC:0,dR:0, tC:0,tR:0};
  var days=[];
  for(var day=1;day<=n;day++){
    var rec=getDay(pid,ym,day)||emptyDay();
    var b=rec.b||{ad:0,ch:0,ex:0,cost:0,rev:0,revEx:0};
    var d=rec.d||{ad:0,ch:0,ex:0,cost:0,rev:0,revEx:0};
    var cuk=rec.cuk||0;

    var bSum=(b.ad||0)+(b.ch||0)+(b.ex||0);
    var bRevT=(b.rev||0)+(b.revEx||0);
    cum.bG+=bSum;cum.bC+=(b.cost||0);cum.bR+=bRevT;

    var dSum=(d.ad||0)+(d.ch||0)+(d.ex||0);
    var dRevT=(d.rev||0)+(d.revEx||0);
    cum.dG+=dSum;cum.dC+=(d.cost||0);cum.dR+=dRevT;

    var costCombinedDay=(b.cost||0)+(d.cost||0);
    var costTotalDay=costCombinedDay+cuk;
    var revCombinedDay=bRevT+dRevT;
    cum.tC+=costTotalDay;cum.tR+=revCombinedDay;

    days.push({
      day:day,hasData:!!getDay(pid,ym,day),
      b:{
        ad:b.ad||0,ch:b.ch||0,ex:b.ex||0,cost:b.cost||0,rev:b.rev||0,revEx:b.revEx||0,
        sum:bSum,sumCum:cum.bG,costCum:cum.bC,revT:bRevT,revCum:cum.bR,
        costPerG:safeDiv(b.cost||0,bSum),costPerGCum:safeDiv(cum.bC,cum.bG),
        avgRevG:safeDiv(bRevT,bSum),avgRevGCum:safeDiv(cum.bR,cum.bG),
        fbPct:safeDiv(b.cost||0,bRevT)*100,fbPctCum:safeDiv(cum.bC,cum.bR)*100
      },
      d:{
        ad:d.ad||0,ch:d.ch||0,ex:d.ex||0,cost:d.cost||0,rev:d.rev||0,revEx:d.revEx||0,
        sum:dSum,sumCum:cum.dG,costCum:cum.dC,revT:dRevT,revCum:cum.dR,
        costPerG:safeDiv(d.cost||0,dSum),costPerGCum:safeDiv(cum.dC,cum.dG),
        avgRevG:safeDiv(dRevT,dSum),avgRevGCum:safeDiv(cum.dR,cum.dG),
        fbPct:safeDiv(d.cost||0,dRevT)*100,fbPctCum:safeDiv(cum.dC,cum.dR)*100
      },
      cuk:cuk,
      t:{
        costDay:costCombinedDay,costTotalDay:costTotalDay,costCum:cum.tC,
        revDay:revCombinedDay,revCum:cum.tR,
        fbPctCum:safeDiv(cum.tC,cum.tR)*100
      }
    });
  }
  var meta=getMeta(pid,ym);
  var mealsTotal=cum.bG+cum.dG;
  var avgRevPerMeal=safeDiv(cum.tR,mealsTotal);
  var avgCostPerMeal=safeDiv(cum.tC,mealsTotal);
  var avgServicePerMeal=safeDiv(meta.labor||0,mealsTotal);
  var foodLaborPerMeal=avgCostPerMeal+avgServicePerMeal;
  var incomePerMeal=avgRevPerMeal-foodLaborPerMeal;
  var profitPct=safeDiv(incomePerMeal,avgRevPerMeal)*100;
  var totalProfitPLN=incomePerMeal*mealsTotal;

  return {
    pid:pid,ym:ym,days:days,
    totals:{
      bGuests:cum.bG,dGuests:cum.dG,mealsTotal:mealsTotal,
      bCost:cum.bC,bRev:cum.bR,dCost:cum.dC,dRev:cum.dR,
      cukSum:days.reduce(function(s,x){return s+x.cuk},0),
      costTotal:cum.tC,revTotal:cum.tR,
      fbCostPct:safeDiv(cum.tC,cum.tR)*100,
      laborMonthly:meta.labor||0,
      avgRevPerMeal:avgRevPerMeal,avgCostPerMeal:avgCostPerMeal,avgServicePerMeal:avgServicePerMeal,
      foodLaborPerMeal:foodLaborPerMeal,incomePerMeal:incomePerMeal,profitPct:profitPct,totalProfitPLN:totalProfitPLN
    }
  };
}
function getAllMonthsWithData(pid){
  var pref='day-'+pid+'-';
  var set={};
  lsKeys(pref).forEach(function(k){
    var rest=k.slice(pref.length); // ym-dd
    var ym=rest.slice(0,7);
    set[ym]=true;
  });
  return Object.keys(set).sort();
}

/* ═══ FORECAST — linear extrapolation to month end from days-with-data-so-far ═══ */
function forecastMonth(M){
  var n=M.days.length;
  var filled=M.days.filter(function(x){return x.hasData});
  var fc=filled.length;
  if(fc===0)return null;
  var lastFilledDay=filled[filled.length-1].day;
  // guard: only forecast if we're not already at/near month end
  var avgRevDay=M.totals.revTotal/fc, avgCostDay=M.totals.costTotal/fc;
  var remainingDays=n-fc;
  var projRev=M.totals.revTotal+avgRevDay*remainingDays;
  var projCost=M.totals.costTotal+avgCostDay*remainingDays;
  return {
    filledDays:fc,remainingDays:remainingDays,lastFilledDay:lastFilledDay,
    projRev:projRev,projCost:projCost,projFbPct:safeDiv(projCost,projRev)*100
  };
}

/* ═══ WEEKDAY ANALYSIS — aggregates across ALL months with data for a property ═══ */
var WD_NAMES=['Ndz','Pon','Wt','Śr','Czw','Pt','Sob'];
function weekdayAnalysis(pid){
  var months=getAllMonthsWithData(pid);
  var agg=[0,1,2,3,4,5,6].map(function(){return {rev:0,cost:0,guests:0,n:0}});
  months.forEach(function(ym){
    var M=calcMonth(pid,ym);
    M.days.forEach(function(x){
      if(!x.hasData)return;
      var dt=new Date(+ym.split('-')[0],+ym.split('-')[1]-1,x.day);
      var wd=dt.getDay();
      agg[wd].rev+=x.t.revDay;agg[wd].cost+=x.t.costTotalDay;
      agg[wd].guests+=x.b.sum+x.d.sum;agg[wd].n++;
    });
  });
  return agg.map(function(a,i){
    return {wd:i,name:WD_NAMES[i],avgRev:safeDiv(a.rev,a.n),avgCost:safeDiv(a.cost,a.n),
      avgFb:safeDiv(a.cost,a.rev)*100,avgGuests:safeDiv(a.guests,a.n),n:a.n};
  });
}

/* ═══ OUTLIER DETECTION — days whose F&B% deviates from month avg by threshold ═══ */
function detectOutliers(M){
  var withData=M.days.filter(function(x){return x.hasData && x.t.revDay>0});
  if(withData.length<3)return {};
  var vals=withData.map(function(x){return safeDiv(x.t.costTotalDay,x.t.revDay)*100});
  var mean=vals.reduce(function(a,b){return a+b},0)/vals.length;
  var variance=vals.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/vals.length;
  var sd=Math.sqrt(variance);
  var out={};
  withData.forEach(function(x){
    var v=safeDiv(x.t.costTotalDay,x.t.revDay)*100;
    if(sd>0 && Math.abs(v-mean)>1.5*sd)out[x.day]=v>mean?'high':'low';
  });
  return out;
}

/* ═══ RANKING — best/worst days by profitability proxy (revenue - cost, i.e. margin) ═══ */
function rankDays(M,topN){
  var withData=M.days.filter(function(x){return x.hasData && x.t.revDay>0});
  var sorted=withData.slice().sort(function(a,b){return (b.t.revDay-b.t.costTotalDay)-(a.t.revDay-a.t.costTotalDay)});
  return {best:sorted.slice(0,topN),worst:sorted.slice(-topN).reverse()};
}

/* ═══ GUEST SEGMENTS — adults/children/extra share across breakfast+dinner ═══ */
function guestSegments(M){
  var ad=0,ch=0,ex=0;
  M.days.forEach(function(x){ad+=x.b.ad+x.d.ad;ch+=x.b.ch+x.d.ch;ex+=x.b.ex+x.d.ex;});
  return {ad:ad,ch:ch,ex:ex,total:ad+ch+ex};
}

/* ═══ MULTI-YEAR SAME-MONTH TREND ═══ */
function multiYearForMonth(pid,mm){
  var months=getAllMonthsWithData(pid).filter(function(ym){return ym.slice(5,7)===mm});
  return months.map(function(ym){
    var T=calcMonth(pid,ym).totals;
    return {ym:ym,year:ym.slice(0,4),revTotal:T.revTotal,costTotal:T.costTotal,fbCostPct:T.fbCostPct,mealsTotal:T.mealsTotal};
  });
}

/* ═══ ALL-PROPERTIES AGGREGATE ═══ */
function calcAllProps(ym){
  var acc={bGuests:0,dGuests:0,mealsTotal:0,bCost:0,bRev:0,dCost:0,dRev:0,cukSum:0,costTotal:0,revTotal:0,laborMonthly:0,totalProfitPLN:0};
  S.props.forEach(function(p){
    var T=calcMonth(p.id,ym).totals;
    acc.bGuests+=T.bGuests;acc.dGuests+=T.dGuests;acc.mealsTotal+=T.mealsTotal;
    acc.bCost+=T.bCost;acc.bRev+=T.bRev;acc.dCost+=T.dCost;acc.dRev+=T.dRev;
    acc.cukSum+=T.cukSum;acc.costTotal+=T.costTotal;acc.revTotal+=T.revTotal;
    acc.laborMonthly+=T.laborMonthly;acc.totalProfitPLN+=T.totalProfitPLN;
  });
  acc.fbCostPct=safeDiv(acc.costTotal,acc.revTotal)*100;
  acc.avgRevPerMeal=safeDiv(acc.revTotal,acc.mealsTotal);
  acc.avgCostPerMeal=safeDiv(acc.costTotal,acc.mealsTotal);
  acc.avgServicePerMeal=safeDiv(acc.laborMonthly,acc.mealsTotal);
  acc.foodLaborPerMeal=acc.avgCostPerMeal+acc.avgServicePerMeal;
  acc.incomePerMeal=acc.avgRevPerMeal-acc.foodLaborPerMeal;
  acc.profitPct=safeDiv(acc.incomePerMeal,acc.avgRevPerMeal)*100;
  return {pid:'__ALL__',ym:ym,totals:acc,days:[]};
}

function lsKeysAfter(prefix){return lsKeys(prefix).map(function(k){return k.slice(prefix.length)})}

function bootLocal(){
  refreshProps();
  if(!S.props.length){
    // seed with a first property named after the source workbook, empty of data
    var id=addProperty('Shellter');
    S.pid=id;lsSet('lastPid',id);
    S.props=getProps();
  }
  handleShortcutParams();
  renderShell();
  renderView();
}
function handleShortcutParams(){
  try{
    var params=new URLSearchParams(window.location.search);
    var action=params.get('action');
    if(action==='entry'){S.view='entry';lsSet('lastView','entry');S.ym=todayYM();S.day=(new Date()).getDate();}
    else if(action==='dashboard'){S.view='dashboard';lsSet('lastView','dashboard');}
    if(action){
      var url=new URL(window.location.href);url.searchParams.delete('action');
      window.history.replaceState({},'',url.pathname+url.search+url.hash);
    }
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════
   MIGRACJA — jednorazowo wypycha istniejące dane lokalne (sprzed
   logowania) do Firestore pod kontem nowo zalogowanego użytkownika.
═══════════════════════════════════════════════════════ */
function migrateLocalDataToCloud(){
  if(localStorage.getItem(LS_PREFIX+'migrated-v1'))return Promise.resolve();
  var localProps=getProps().filter(function(p){return !p.ownerEmail});
  if(!localProps.length){localStorage.setItem(LS_PREFIX+'migrated-v1','1');return Promise.resolve();}
  var tasks=localProps.map(function(p){
    p.ownerEmail=S.userEmailLower;
    p.memberEmails=[S.userEmailLower];
    p.members=[{email:S.userEmailLower,role:'admin'}];
    if(typeof p.targetFb!=='number')p.targetFb=lsGet('target-'+p.id,30);
    updatePropertyLocal(p);
    var subTasks=[];
    lsKeysAfter('day-'+p.id+'-').forEach(function(rest){
      var rec=lsGet('day-'+p.id+'-'+rest,null);
      if(rec)subTasks.push(db.collection('properties/'+p.id+'/days').doc(rest).set(rec));
    });
    lsKeysAfter('meta-'+p.id+'-').forEach(function(ym){
      var m=lsGet('meta-'+p.id+'-'+ym,null);
      var budget=lsGet('budget-'+p.id+'-'+ym,null);
      var merged=Object.assign({},m||{},budget?{budgetRev:budget.rev,budgetCost:budget.cost}:{});
      if(Object.keys(merged).length)subTasks.push(db.collection('properties/'+p.id+'/monthMeta').doc(ym).set(merged));
    });
    return db.collection('properties').doc(p.id).set(p).then(function(){return Promise.all(subTasks)});
  });
  return Promise.all(tasks).then(function(){localStorage.setItem(LS_PREFIX+'migrated-v1','1')})
    .catch(function(e){console.warn('Migracja pominięta:',e.message)});
}

/* ═══════════════════════════════════════════════════════
   ŁADOWANIE DANYCH Z FIRESTORE — wszystkie obiekty, w których
   mój email jest na liście memberEmails, plus ich dane dzienne.
═══════════════════════════════════════════════════════ */
function loadUserDataFromFirestore(){
  return db.collection('properties').where('memberEmails','array-contains',S.userEmailLower).get().then(function(snap){
    var props=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    saveProps(props);
    var tasks=props.map(function(p){
      var t1=db.collection('properties/'+p.id+'/days').get().then(function(s){
        s.docs.forEach(function(d){lsSet('day-'+p.id+'-'+d.id,d.data())});
      });
      var t2=db.collection('properties/'+p.id+'/monthMeta').get().then(function(s){
        s.docs.forEach(function(d){
          var data=d.data();
          lsSet('meta-'+p.id+'-'+d.id,{labor:data.labor||0});
          if(typeof data.budgetRev!=='undefined'||typeof data.budgetCost!=='undefined'){
            lsSet('budget-'+p.id+'-'+d.id,{rev:data.budgetRev||0,cost:data.budgetCost||0});
          }
        });
      });
      return Promise.all([t1,t2]);
    });
    return Promise.all(tasks);
  });
}

/* ═══════════════════════════════════════════════════════
   AUTH — logowanie / rejestracja / reset hasła / wylogowanie
═══════════════════════════════════════════════════════ */
function switchAuthTab(tab){
  document.getElementById('form-login').style.display=tab==='login'?'':'none';
  document.getElementById('form-reg').style.display=tab==='reg'?'':'none';
  document.getElementById('tab-login').classList.toggle('on',tab==='login');
  document.getElementById('tab-reg').classList.toggle('on',tab==='reg');
  clearAuthMsg();
}
function showAuthErr(msg){
  var e=document.getElementById('auth-err');if(e){e.textContent=msg;e.classList.add('show');}
  document.getElementById('auth-ok').classList.remove('show');
  document.getElementById('auth-loading').classList.remove('show');
}
function showAuthOk(msg){
  var e=document.getElementById('auth-ok');if(e){e.textContent=msg;e.classList.add('show');}
  document.getElementById('auth-err').classList.remove('show');
  document.getElementById('auth-loading').classList.remove('show');
}
function showAuthLoading(msg){
  document.getElementById('auth-err').classList.remove('show');
  document.getElementById('auth-ok').classList.remove('show');
  var e=document.getElementById('auth-loading');if(e){e.textContent=msg||'⏳ Łączenie...';e.classList.add('show');}
}
function clearAuthMsg(){
  ['auth-err','auth-ok','auth-loading'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('show')});
}
function fbErrMsg(code){
  var map={
    'auth/invalid-email':'Nieprawidłowy adres email.',
    'auth/user-not-found':'Nie znaleziono konta z tym emailem.',
    'auth/wrong-password':'Nieprawidłowe hasło.',
    'auth/email-already-in-use':'Konto z tym emailem już istnieje.',
    'auth/weak-password':'Hasło musi mieć co najmniej 6 znaków.',
    'auth/too-many-requests':'Zbyt wiele prób. Spróbuj później.',
    'auth/network-request-failed':'Brak połączenia z internetem.',
    'auth/invalid-credential':'Nieprawidłowy email lub hasło.'
  };
  return map[code]||('Błąd: '+code);
}
function isSecureOrigin(){
  try{return /^https?:$/.test(location.protocol)||location.hostname==='localhost'}catch(e){return false}
}
function authTimeoutRace(promise,label){
  var timedOut=false;
  var timer=setTimeout(function(){
    timedOut=true;
    showAuthErr('⏱️ '+label+' trwa zbyt długo. Najczęstsza przyczyna: aplikacja jest otwarta jako lokalny plik, a nie przez adres https:// / z hostingu. Wystaw ją np. przez Firebase Hosting i spróbuj ponownie.');
  },10000);
  return promise.then(function(r){if(!timedOut)clearTimeout(timer);return r}).catch(function(e){
    clearTimeout(timer);
    if(!timedOut)throw e;
  });
}
function authLogin(){
  var email=(document.getElementById('l-email').value||'').trim();
  var pass=document.getElementById('l-pass').value||'';
  if(!email||!pass){showAuthErr('Podaj email i hasło.');return}
  showAuthLoading('⏳ Logowanie...');
  authTimeoutRace(auth.signInWithEmailAndPassword(email,pass),'Logowanie').catch(function(e){if(e&&e.code)showAuthErr(fbErrMsg(e.code))});
}
function authRegister(){
  var email=(document.getElementById('r-email').value||'').trim();
  var pass=document.getElementById('r-pass').value||'';
  var pass2=document.getElementById('r-pass2').value||'';
  if(!email||!pass){showAuthErr('Podaj email i hasło.');return}
  if(pass!==pass2){showAuthErr('Hasła nie są identyczne.');return}
  showAuthLoading('⏳ Tworzenie konta...');
  authTimeoutRace(auth.createUserWithEmailAndPassword(email,pass),'Rejestracja').catch(function(e){if(e&&e.code)showAuthErr(fbErrMsg(e.code))});
}
function authReset(){
  var email=(document.getElementById('l-email').value||'').trim();
  if(!email){showAuthErr('Podaj email, na który wysłać link resetujący.');return}
  auth.sendPasswordResetEmail(email).then(function(){
    showAuthOk('Wysłano link do resetu hasła na '+email);
  }).catch(function(e){showAuthErr(fbErrMsg(e.code))});
}
function authLogout(){
  closeSidebar();
  auth.signOut();
}
function showLogin(){
  S.uid=null;S.userEmail=null;S.userEmailLower=null;S.currentRole=null;S.pid=null;S.props=[];
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').style.display='none';
  document.getElementById('auth-loading').classList.remove('show');
  clearAuthMsg();
}
function showApp(user){
  S.uid=user.uid;S.userEmail=user.email;S.userEmailLower=(user.email||'').toLowerCase();
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display='';
  setConnStatus(navigator.onLine?'online':'offline');
  migrateLocalDataToCloud().then(function(){
    return loadUserDataFromFirestore();
  }).then(function(){
    finishStartup();
  }).catch(function(e){
    console.warn('Firestore load error:',e);
    setConnStatus('offline');
    finishStartup();
  });
}
function finishStartup(){
  refreshProps();
  refreshCurrentRole();
  handleShortcutParams();
  renderShell();
  renderView();
}

function initApp(){
  setupPWA();
  applyTheme(currentTheme());
  if(!FB_CONFIGURED){
    // Firebase not set up yet — app stays fully usable offline/local-only.
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').style.display='';
    bootLocal();
    return;
  }
  if(!isSecureOrigin()){
    var box=document.querySelector('.auth-box');
    if(box)box.insertAdjacentHTML('afterbegin',
      '<div class="auth-msg show" style="display:block;background:rgba(246,185,59,.14);color:var(--amber);border:1px solid rgba(246,185,59,.35);margin-bottom:16px">'+
      '⚠️ Ta aplikacja jest otwarta jako lokalny plik ('+esc(location.protocol)+'), a logowanie wymaga adresu https://. Wystaw plik przez hosting (np. Firebase Hosting), inaczej logowanie nie zadziała.</div>');
  }
  document.getElementById('app').style.display='none';
  auth.onAuthStateChanged(function(user){
    if(user)showApp(user);else showLogin();
  });
}
document.addEventListener('DOMContentLoaded',initApp);


function renderView(){
  var root=document.getElementById('view-root');
  if(S.view==='dashboard')root.innerHTML=viewDashboard();
  else if(S.view==='entry')root.innerHTML=viewEntry();
  else if(S.view==='analysis')root.innerHTML=viewAnalysis();
  else if(S.view==='compare')root.innerHTML=viewCompare();
  else if(S.view==='properties')root.innerHTML=viewProperties();
  else if(S.view==='settings')root.innerHTML=viewSettings();
  var spacer=document.createElement('div');
  spacer.className='view-end-spacer';
  root.appendChild(spacer);
  updateSaveBar();
  // Defer chart creation to the next painted frame so the new tab's
  // text/tables appear immediately instead of the old tab lingering
  // while Chart.js does its (synchronous, sometimes slow) work.
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      afterRenderHook();
    });
  });
}
function updateSaveBar(){
  var bar=document.getElementById('entry-savebar');
  var showBar=S.view==='entry'&&!!S.pid&&_entryMode==='day';
  document.body.classList.toggle('entry-active',showBar);
  if(showBar){
    bar.classList.add('on');
    bar.innerHTML='<button class="btn primary" onclick="saveEntryDay()">💾 Zapisz dzień '+S.day+'</button>';
  }else{
    bar.classList.remove('on');
    bar.innerHTML='';
  }
}
function afterRenderHook(){
  if(S.view==='dashboard')afterDashboard();
  if(S.view==='entry')afterEntry();
  if(S.view==='analysis')afterAnalysis();
  if(S.view==='compare')afterCompare();
}

var _entryMode=lsGet('entryMode','day');
function viewEntry(){
  if(!S.pid)return emptyState('Brak obiektów','Dodaj obiekt, aby wprowadzać dane.','properties','Dodaj obiekt');
  var n=dim(S.ym);
  if(S.day>n)S.day=1;

  var filledCount=0;for(var i=1;i<=n;i++)if(hasDay(S.pid,S.ym,i))filledCount++;
  var pct=Math.round(filledCount/n*100);

  var h='';
  // Month switcher (local to this view, so you don't need the sidebar)
  var pym=S.ym.split('-'),eyr=pym[0],emo=pym[1];
  var moOpts=MONTHS_FULL.map(function(m,i){var v=String(i+1).padStart(2,'0');return '<option value="'+v+'"'+(v===emo?' selected':'')+'>'+m+'</option>'}).join('');
  var yrOpts='';for(var yy=2023;yy<=2030;yy++){yrOpts+='<option value="'+yy+'"'+(String(yy)===eyr?' selected':'')+'>'+yy+'</option>'}
  h+='<div class="card" style="margin-bottom:16px">';
  h+='<div class="stitle" style="margin-top:0">Miesiąc</div>';
  h+='<div class="btn-row" style="align-items:center;margin-bottom:12px">'+
     '<button class="icon-btn" onclick="entryShiftMonth(-1)" title="Poprzedni miesiąc">◂</button>'+
     '<div style="flex:1;display:grid;grid-template-columns:2fr 1fr;gap:8px">'+
       '<select class="s-input" id="entry-sel-month" onchange="entryOnMonthYearChange()">'+moOpts+'</select>'+
       '<select class="s-input" id="entry-sel-year" onchange="entryOnMonthYearChange()">'+yrOpts+'</select>'+
     '</div>'+
     '<button class="icon-btn" onclick="entryShiftMonth(1)" title="Następny miesiąc">▸</button>'+
     '</div>';
  h+='<div class="progress-row"><div class="progress"><i style="width:'+pct+'%"></i></div><span class="progress-lbl">'+filledCount+'/'+n+' dni ('+pct+'%)</span></div>';
  h+='<div class="btn-row" style="margin-top:10px"><button class="btn sm" onclick="openDuplicateMonthModal()">📋 Duplikuj miesiąc jako szablon</button></div>';
  h+='</div>';

  // Mode toggle: day-by-day vs table
  h+='<div class="pill-select" style="margin-bottom:16px">'+
     '<button class="'+(_entryMode==='day'?'on':'')+'" onclick="setEntryMode(\'day\')">Dzień po dniu</button>'+
     '<button class="'+(_entryMode==='table'?'on':'')+'" onclick="setEntryMode(\'table\')">Tabela (cały miesiąc)</button>'+
     '</div>';

  if(_entryMode==='table')return h+viewEntryTable(n);
  return h+viewEntryDay(n);
}
function setEntryMode(m){_entryMode=m;lsSet('entryMode',m);renderView()}

function viewEntryDay(n){
  var rec=getDay(S.pid,S.ym,S.day)||emptyDay();
  var h='';
  // Day picker grid
  h+='<div class="card" style="margin-bottom:16px">';
  h+='<div class="stitle" style="margin-top:0">Wybierz dzień <small>'+mLabelFull(S.ym)+'</small></div>';
  h+='<div class="day-grid">';
  for(var d=1;d<=n;d++){
    var filled=hasDay(S.pid,S.ym,d);
    h+='<div class="day-cell'+(filled?' filled':'')+(d===S.day?' active':'')+'" onclick="entrySetDay('+d+')">'+d+'</div>';
  }
  h+='</div>';
  h+='<div class="btn-row"><button class="btn sm" onclick="entryShiftDay(-1)">◂ Poprzedni dzień</button><button class="btn sm" onclick="entryShiftDay(1)">Następny dzień ▸</button><button class="btn sm" onclick="copyFromPreviousDay()">📑 Kopiuj z poprzedniego dnia</button></div>';
  h+='</div>';

  // Breakfast section
  h+=entrySection('b','Śniadania','sec-b',rec.b,[
    ['ad','Dorośli (ilość)'],['ch','Dzieci (ilość)'],['ex','Sprzedaż dodatkowa (ilość)'],
    ['cost','Koszt śniadania (zł)'],['rev','Przychód ze śniadania (zł)'],['revEx','Przychód dodatkowy — sprzedaż dod. (zł)']
  ]);
  // Dinner section
  h+=entrySection('d','Kolacje','sec-d',rec.d,[
    ['ad','Dorośli (ilość)'],['ch','Dzieci (ilość)'],['ex','Sprzedaż dodatkowa (ilość)'],
    ['cost','Koszt kolacji (zł)'],['rev','Przychód z kolacji (zł)'],['revEx','Przychód dodatkowy — sprzedaż dod. + M&E (zł)']
  ]);

  // Combined section (auto + cukiernia manual input)
  var bSum=(rec.b.ad||0)+(rec.b.ch||0)+(rec.b.ex||0),bRevT=(rec.b.rev||0)+(rec.b.revEx||0);
  var dSum=(rec.d.ad||0)+(rec.d.ch||0)+(rec.d.ex||0),dRevT=(rec.d.rev||0)+(rec.d.revEx||0);
  var costComb=(rec.b.cost||0)+(rec.d.cost||0);
  var costTotal=costComb+(rec.cuk||0);
  var revTotal=bRevT+dRevT;
  var fbDay=safeDiv(costTotal,revTotal)*100;

  h+='<div class="card sec-t" style="margin-bottom:16px">';
  h+='<div class="stitle" style="margin-top:0">Śniadania + Kolacje <small>uzupełnia się automatycznie</small></div>';
  h+='<div class="field" style="max-width:260px"><label>Magazyn cukiernia — koszt dzienny (zł)</label>'+
     '<input type="number" step="0.01" inputmode="decimal" id="ent-cuk" value="'+(rec.cuk||'')+'" placeholder="0.00"></div>';
  h+='<div class="ccards">'+
     ccard('Goście łącznie',bSum+dSum)+
     ccard('Koszt łącznie',fmt2(costTotal)+' zł')+
     ccard('Przychód łącznie',fmt2(revTotal)+' zł')+
     ccard('F&B Cost dzień',fmtPct(fbDay))+
     '</div>';
  h+='</div>';
  return h;
}

/* ═══ UNDO LAST SAVE ═══ */
var _lastAction=null;
function saveEntryDay(){
  if(!S.pid){toast('Wybierz obiekt','err');return}
  if(!requireEdit())return;
  var rec={
    b:{ad:readNum('ent-b-ad'),ch:readNum('ent-b-ch'),ex:readNum('ent-b-ex'),cost:readNum('ent-b-cost'),rev:readNum('ent-b-rev'),revEx:readNum('ent-b-revEx')},
    d:{ad:readNum('ent-d-ad'),ch:readNum('ent-d-ch'),ex:readNum('ent-d-ex'),cost:readNum('ent-d-cost'),rev:readNum('ent-d-rev'),revEx:readNum('ent-d-revEx')},
    cuk:readNum('ent-cuk')
  };
  var bSum=rec.b.ad+rec.b.ch+rec.b.ex,dSum=rec.d.ad+rec.d.ch+rec.d.ex;
  var revT=(rec.b.rev+rec.b.revEx)+(rec.d.rev+rec.d.revEx);
  var costT=rec.b.cost+rec.d.cost+rec.cuk;
  var fbPct=safeDiv(costT,revT)*100;
  // Soft validation: warn on suspicious values before saving
  var warnings=[];
  if((bSum>0||dSum>0)&&revT===0)warnings.push('Wprowadzono gości, ale przychód wynosi 0 zł.');
  if(revT>0&&isFinite(fbPct)&&fbPct>75)warnings.push('F&B Cost dnia jest bardzo wysoki ('+fbPct.toFixed(1)+'%) — sprawdź, czy koszty lub przychody nie zawierają literówki.');
  if(revT>0&&isFinite(fbPct)&&fbPct<2&&costT>0)warnings.push('F&B Cost dnia jest bardzo niski ('+fbPct.toFixed(1)+'%) — sprawdź dane.');
  if(warnings.length){
    showModal('Dane wyglądają nietypowo',
      '<p style="font-size:.82rem;color:var(--tx2);margin-bottom:12px">'+warnings.map(esc).join('<br>')+'</p>'+
      '<div class="btn-row"><button class="btn primary block" onclick="forceSaveEntryDay()">Zapisz mimo to</button><button class="btn block" onclick="closeModal()">Wróć i popraw</button></div>'
    );
    window._pendingEntryRec=rec;
    return;
  }
  commitSaveEntryDay(rec);
}
function forceSaveEntryDay(){
  closeModal();
  if(window._pendingEntryRec){commitSaveEntryDay(window._pendingEntryRec);window._pendingEntryRec=null}
}
function commitSaveEntryDay(rec){
  var prev=getDay(S.pid,S.ym,S.day);
  _lastAction={pid:S.pid,ym:S.ym,day:S.day,prevRec:prev};
  saveDay(S.pid,S.ym,S.day,rec);
  haptic(15);
  toast('Zapisano dzień '+S.day+' ('+mLabel(S.ym)+') · ↩ cofnij w Ustawieniach','ok');
  renderView();
}
function undoLastAction(){
  if(!_lastAction){toast('Brak akcji do cofnięcia','err');return}
  saveDay(_lastAction.pid,_lastAction.ym,_lastAction.day,_lastAction.prevRec||emptyDay());
  if(!_lastAction.prevRec)lsDel(dayKey(_lastAction.pid,_lastAction.ym,_lastAction.day));
  toast('Cofnięto ostatni zapis (dzień '+_lastAction.day+')','ok');
  _lastAction=null;
  renderView();
}

function rankList(days,numCls){
  if(!days.length)return '<div class="page-sub">Brak wystarczających danych</div>';
  return days.map(function(x,i){
    var margin=x.t.revDay-x.t.costTotalDay;
    return '<div class="rank-item"><div class="rank-num'+(numCls?' '+numCls:'')+'">'+(i+1)+'</div>'+
      '<div class="rank-info">Dzień '+x.day+' <span style="color:var(--tx3)">· F&B '+fmtPct(safeDiv(x.t.costTotalDay,x.t.revDay)*100)+'</span></div>'+
      '<div class="rank-val '+(margin>=0?'td-pos':'td-neg')+'">'+(margin>=0?'+':'')+fmt2(margin)+' zł</div></div>';
  }).join('');
}
function analysisHeader(tab){
  if(tab==='t')return '<tr><th>Dzień</th><th>Koszt dzień</th><th>+Cukiernia</th><th>Koszt narast.</th><th>Przychód dzień</th><th>Przychód narast.</th><th>F&B % narast.</th></tr>';
  return '<tr><th>Dzień</th><th>Dorośli</th><th>Dzieci</th><th>Dodatk.</th><th>Suma</th><th>Suma narast.</th><th>Koszt dzień</th><th>Koszt narast.</th><th>Przychód total</th><th>Przychód narast.</th><th>Koszt/os.</th><th>Śr.przych./os.</th><th>F&B % narast.</th></tr>';
}
function analysisRow(tab,x,outliers){
  outliers=outliers||{};
  var out=outliers[x.day];
  var cls=(x.hasData?'':'day-empty')+(out?' day-outlier':'');
  var flag=out?(out==='high'?' 🔺':' 🔻'):'';
  if(tab==='t'){
    return '<tr class="'+cls+'"><td>'+x.day+flag+'</td><td>'+fmt2(x.t.costDay)+'</td><td>'+fmt2(x.cuk)+'</td><td>'+fmt2(x.t.costCum)+'</td><td>'+fmt2(x.t.revDay)+'</td><td>'+fmt2(x.t.revCum)+'</td><td>'+fmtPct(x.t.fbPctCum)+'</td></tr>';
  }
  var o=x[tab];
  return '<tr class="'+cls+'"><td>'+x.day+flag+'</td><td>'+o.ad+'</td><td>'+o.ch+'</td><td>'+o.ex+'</td><td>'+o.sum+'</td><td>'+o.sumCum+'</td><td>'+fmt2(o.cost)+'</td><td>'+fmt2(o.costCum)+'</td><td>'+fmt2(o.revT)+'</td><td>'+fmt2(o.revCum)+'</td><td>'+fmt2(o.costPerG)+'</td><td>'+fmt2(o.avgRevG)+'</td><td>'+fmtPct(o.fbPctCum)+'</td></tr>';
}

var _ctab=lsGet('ctab','mom');
var _cmpPid2=null;
function viewCompare(){
  if(!S.pid)return emptyState('Brak obiektów','Dodaj obiekt, aby porównywać dane.','properties','Dodaj obiekt');
  window._cmpData=null;window._multiData=null;
  var h='<div class="tabs">'+
    '<button class="tab'+(_ctab==='mom'?' on':'')+'" onclick="switchCTab(\'mom\')">Miesiąc vs Miesiąc</button>'+
    '<button class="tab'+(_ctab==='yoy'?' on':'')+'" onclick="switchCTab(\'yoy\')">Rok vs Rok</button>'+
    '<button class="tab'+(_ctab==='multi'?' on':'')+'" onclick="switchCTab(\'multi\')">Wiele lat</button>'+
    '<button class="tab'+(_ctab==='prop'?' on':'')+'" onclick="switchCTab(\'prop\')">Obiekt vs Obiekt</button>'+
    '</div>';

  else if(_ctab==='yoy')h+=compareYoY();
  else if(_ctab==='multi')h+=compareMulti();

function switchCTab(t){_ctab=t;lsSet('ctab',t);renderView()}

function compareMulti(){
  var mm=S.ym.split('-')[1];
  var data=multiYearForMonth(S.pid,mm);
  if(data.length<1)return '<div class="empty">Brak danych historycznych dla miesiąca '+MONTHS_FULL[+mm-1]+' w innych latach.</div>';
  var h='<div class="page-sub" style="margin-bottom:10px">'+MONTHS_FULL[+mm-1]+' — porównanie na przestrzeni lat ('+data.map(function(d){return d.year}).join(', ')+')</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Rok</th><th>Przychód total</th><th>Koszt total</th><th>F&B Cost %</th><th>Posiłków</th></tr></thead><tbody>';
  data.forEach(function(d){
    h+='<tr><td>'+d.year+'</td><td>'+fmt2(d.revTotal)+'</td><td>'+fmt2(d.costTotal)+'</td><td>'+fmtPct(d.fbCostPct)+'</td><td>'+d.mealsTotal+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="chart-box" style="margin-top:16px"><div class="stitle" style="margin-top:0">Przychód vs Koszt — '+MONTHS_FULL[+mm-1]+' wg roku</div><canvas id="ch-multi"></canvas></div>';
  window._multiData=data;
  return h;
}

function compareMoM(){
  var cur=S.ym,pm=prevM(cur);
  var Tc=calcMonth(S.pid,cur).totals,Tp=calcMonth(S.pid,pm).totals;
  var d=Tc.revTotal-Tp.revTotal,pct=Tp.revTotal>0?d/Tp.revTotal*100:null;
  var h='<div class="page-sub" style="margin-bottom:10px">'+mLabelFull(cur)+' vs '+mLabelFull(pm)+'</div>';
  h+='<div class="ccards">'+
    ccard(mLabel(cur)+' — przychód',fmt(Tc.revTotal))+
    ccard(mLabel(pm)+' — przychód',fmt(Tp.revTotal))+
    ccard('Zmiana',(d>=0?'+':'')+fmt2(d)+' zł')+
    '<div class="ccard"><div class="ccard-l">Zmiana %</div><div class="ccard-v">'+chBadge(pct)+'</div></div>'+
    '</div>';
  h+=compareTable([
    ['Goście śniadania',Tc.bGuests,Tp.bGuests],
    ['Goście kolacje',Tc.dGuests,Tp.dGuests],
    ['Koszt total',Tc.costTotal,Tp.costTotal],
    ['Przychód total',Tc.revTotal,Tp.revTotal],
    ['F&B Cost %',Tc.fbCostPct,Tp.fbCostPct,true],
    ['Dochód bufety (PLN)',Tc.totalProfitPLN,Tp.totalProfitPLN]
  ],mLabel(cur),mLabel(pm));
  h+='<div class="chart-box" style="margin-top:16px"><div class="stitle" style="margin-top:0">Przychód dzień po dniu</div><canvas id="ch-cmp"></canvas></div>';
  window._cmpData={type:'mom',a:calcMonth(S.pid,cur),b:calcMonth(S.pid,pm),la:mLabel(cur),lb:mLabel(pm)};
  return h;
}
function compareYoY(){
  var cur=S.ym,ly=yoyM(cur);
  var Tc=calcMonth(S.pid,cur).totals,Tl=calcMonth(S.pid,ly).totals;
  var d=Tc.revTotal-Tl.revTotal,pct=Tl.revTotal>0?d/Tl.revTotal*100:null;
  var h='<div class="page-sub" style="margin-bottom:10px">'+mLabelFull(cur)+' vs '+mLabelFull(ly)+' (rok wcześniej)</div>';
  h+='<div class="ccards">'+
    ccard(cur,fmt(Tc.revTotal))+
    ccard(ly,fmt(Tl.revTotal))+
    ccard('Zmiana',(d>=0?'+':'')+fmt2(d)+' zł')+
    '<div class="ccard"><div class="ccard-l">Zmiana %</div><div class="ccard-v">'+chBadge(pct)+'</div></div>'+
    '</div>';
  h+=compareTable([
    ['Goście śniadania',Tc.bGuests,Tl.bGuests],
    ['Goście kolacje',Tc.dGuests,Tl.dGuests],
    ['Koszt total',Tc.costTotal,Tl.costTotal],
    ['Przychód total',Tc.revTotal,Tl.revTotal],
    ['F&B Cost %',Tc.fbCostPct,Tl.fbCostPct,true],
    ['Dochód bufety (PLN)',Tc.totalProfitPLN,Tl.totalProfitPLN]
  ],cur,ly);
  h+='<div class="chart-box" style="margin-top:16px"><div class="stitle" style="margin-top:0">Przychód dzień po dniu</div><canvas id="ch-cmp"></canvas></div>';
  window._cmpData={type:'yoy',a:calcMonth(S.pid,cur),b:calcMonth(S.pid,ly),la:cur,lb:ly};
  return h;
}
function compareProp(){
  var others=S.props.filter(function(p){return p.id!==S.pid});
  if(!others.length)return '<div class="empty">Dodaj drugi obiekt, aby porównać.</div>';
  if(!_cmpPid2||!others.find(function(p){return p.id===_cmpPid2}))_cmpPid2=others[0].id;
  var opts=others.map(function(p){return '<option value="'+p.id+'"'+(p.id===_cmpPid2?' selected':'')+'>'+esc(p.name)+'</option>'}).join('');
  var h='<div class="field" style="max-width:280px"><label>Porównaj z obiektem</label><select class="s-input" onchange="_cmpPid2=this.value;renderView()">'+opts+'</select></div>';
  var Tc=calcMonth(S.pid,S.ym).totals,Tb=calcMonth(_cmpPid2,S.ym).totals;
  var nameA=currentProp().name,nameB=S.props.find(function(p){return p.id===_cmpPid2}).name;
  h+='<div class="page-sub" style="margin:10px 0">'+mLabelFull(S.ym)+'</div>';
  h+=compareTable([
    ['Goście śniadania',Tc.bGuests,Tb.bGuests],
    ['Goście kolacje',Tc.dGuests,Tb.dGuests],
    ['Koszt total',Tc.costTotal,Tb.costTotal],
    ['Przychód total',Tc.revTotal,Tb.revTotal],
    ['F&B Cost %',Tc.fbCostPct,Tb.fbCostPct,true],
    ['Dochód bufety (PLN)',Tc.totalProfitPLN,Tb.totalProfitPLN]
  ],nameA,nameB);
  window._cmpData=null;
  return h;
}
function compareTable(rows,la,lb){
  var h='<div class="tbl-wrap"><table><thead><tr><th>Metryka</th><th>'+esc(la)+'</th><th>'+esc(lb)+'</th><th>Δ</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var isPct=r[3];
    var a=r[1],b=r[2],d=a-b;
    var av=isPct?fmtPct(a):fmt2(a);
    var bv=isPct?fmtPct(b):fmt2(b);
    var dv=isPct?(d>=0?'+':'')+d.toFixed(1)+'pp':(d>=0?'+':'')+fmt2(d);
    h+='<tr><td style="font-family:var(--fb)">'+r[0]+'</td><td>'+av+'</td><td>'+bv+'</td><td class="'+(d>=0?'td-pos':'td-neg')+'">'+dv+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function afterCompare(){
  dChart('ch-cmp');dChart('ch-multi');
  if(window._multiData){
    var md=window._multiData;
    dChart('ch-multi');

}

function openTeamModal(pid){
  var p=S.props.find(function(x){return x.id===pid});
  if(!p)return;
  var isAdmin=getMyRole(p)==='admin';
  var members=p.members||[{email:p.ownerEmail||'',role:'admin'}];
  var body='<div style="font-size:.8rem;color:var(--tx2);margin-bottom:14px">Osoby z dostępem do <b>'+esc(p.name)+'</b>:</div>';
  body+=members.map(function(m){
    var initial=(m.email||'?').charAt(0).toUpperCase();
    return '<div class="team-member"><div class="team-avatar">'+initial+'</div>'+
      '<div class="team-info"><div class="team-email">'+esc(m.email)+'</div><div class="team-role">'+({admin:'Administrator',manager:'Manager — edycja',viewer:'Podgląd — tylko odczyt'}[m.role]||m.role)+'</div></div>'+
      (isAdmin&&m.email!==p.ownerEmail?'<button class="icon-btn" onclick="removeMemberAndRefresh(\''+pid+'\',\''+esc(m.email)+'\')">'+ICONS.trash+'</button>':'')+
      '</div>';
  }).join('');
  if(isAdmin){
    body+='<div style="margin-top:16px"><div class="field"><label>Zaproś nową osobę (email)</label><input class="s-input" id="team-invite-email" type="email" placeholder="osoba@hotel.pl" onkeydown="if(event.key===\'Enter\')doInviteMember(\''+pid+'\')"></div>'+
      '<div class="field"><label>Rola</label><select class="s-input" id="team-invite-role"><option value="manager">Manager — może edytować dane</option><option value="viewer">Podgląd — tylko odczyt</option></select></div>'+
      '<button class="btn primary block" onclick="doInviteMember(\''+pid+'\')">+ Zaproś</button>'+
      '<p style="font-size:.68rem;color:var(--tx3);margin-top:8px">Osoba musi mieć (lub założyć) konto w BufetCost na ten sam adres email — wtedy automatycznie zobaczy ten obiekt po zalogowaniu.</p></div>';
  }else{
    body+='<p style="font-size:.72rem;color:var(--tx3);margin-top:14px">Tylko administrator obiektu może zapraszać nowe osoby.</p>';
  }
  showModal('👥 Zespół obiektu',body);
}
function doInviteMember(pid){
  var email=document.getElementById('team-invite-email').value;
  var role=document.getElementById('team-invite-role').value;
  var res=inviteMemberToProperty(pid,email,role);
  if(!res.ok){toast(res.msg,'err');return}
  refreshProps();
  toast('Zaproszono '+email,'ok');
  openTeamModal(pid);
}
function removeMemberAndRefresh(pid,email){
  removeMemberFromProperty(pid,email);
  refreshProps();
  toast('Usunięto dostęp dla '+email,'ok');
  openTeamModal(pid);
}

function exportData(){
  var all={};
  Object.keys(localStorage).filter(function(k){return k.indexOf(LS_PREFIX)===0}).forEach(function(k){
    all[k.slice(LS_PREFIX.length)]=JSON.parse(localStorage.getItem(k));
  });
  var blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bufetcost-export-'+todayYM()+'.json';
  a.click();
  toast('Wyeksportowano dane','ok');
}
function importData(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      Object.keys(data).forEach(function(k){lsSet(k,data[k])});
      toast('Zaimportowano dane','ok');
      refreshProps();renderShell();renderView();
    }catch(err){toast('Błąd pliku importu','err')}
  };
  reader.readAsText(file);
}

    '<div class="btn-row"><button class="btn danger block" onclick="doClearAll()">Wyczyść trwale</button><button class="btn block" onclick="closeModal()">Anuluj</button></div>'
  );
}
function doClearAll(){
  Object.keys(localStorage).filter(function(k){return k.indexOf(LS_PREFIX)===0}).forEach(function(k){localStorage.removeItem(k)});
  closeModal();refreshProps();S.ym=todayYM();renderShell();go('dashboard');
  toast('Wyczyszczono dane','ok');
}

var _dashAll=lsGet('dashAll',false);
function getDashWidgets(){return lsGet('dashWidgets',{today:true,kpi:true,rings:true,trend:true,splitfbday:true})}
function setDashWidget(key,val){var w=getDashWidgets();w[key]=val;lsSet('dashWidgets',w)}

function calcAllPropsDays(ym){
  var n=dim(ym);
  var perProp=S.props.map(function(p){return calcMonth(p.id,ym)});
  var days=[],cumRev=0,cumCost=0;
  for(var i=0;i<n;i++){
    var revDay=0,costDay=0;
    perProp.forEach(function(pm){var x=pm.days[i];if(x){revDay+=x.t.revDay;costDay+=x.t.costTotalDay;}});
    cumRev+=revDay;cumCost+=costDay;
    days.push({day:i+1,hasData:true,t:{revDay:revDay,costTotalDay:costDay,revCum:cumRev,costCum:cumCost,fbPctCum:safeDiv(cumCost,cumRev)*100}});
  }
  return days;
}

function viewDashboard(){
  if(!S.pid)return emptyState('Brak obiektów','Dodaj pierwszy obiekt, aby zacząć wprowadzać dane.','properties','Dodaj obiekt');
  var w=getDashWidgets();
  var isAll=_dashAll&&S.props.length>1;
  var T,days;
  if(isAll){T=calcAllProps(S.ym).totals;days=calcAllPropsDays(S.ym);}
  else{var M=calcMonth(S.pid,S.ym);T=M.totals;days=M.days;}
  var pm=prevM(S.ym);
  var Tp=isAll?calcAllProps(pm).totals:calcMonth(S.pid,pm).totals;
  var momRev=Tp.revTotal>0?(T.revTotal-Tp.revTotal)/Tp.revTotal*100:null;
  var target=isAll?30:getTargetFB(S.pid);
  window._dashDays=days;window._dashT=T;

  var h='';
  h+='<div class="btn-row" style="margin-bottom:14px;justify-content:space-between;align-items:center">';
  if(S.props.length>1){
    h+='<div class="pill-select" style="max-width:340px"><button class="'+(!isAll?'on':'')+'" onclick="_dashAll=false;lsSet(\'dashAll\',false);renderView()">'+esc(currentProp().name)+'</button><button class="'+(isAll?'on':'')+'" onclick="_dashAll=true;lsSet(\'dashAll\',true);renderView()">Wszystkie obiekty (suma)</button></div>';
  } else h+='<div></div>';
  h+='<button class="icon-btn" onclick="openDashPersonalize()" title="Personalizuj pulpit">⚙️</button>';
  h+='</div>';

  if(w.today&&!isAll)h+=dashTodayCard();

  if(w.kpi){
    h+='<div class="kgrid">';
    h+=kpiCard('Przychód total','warm',fmt(T.revTotal),momRev!==null?chBadge(momRev)+' vs '+mLabel(pm):'');
    h+=kpiCard('Koszt total (F&amp;B)','cool',fmt(T.costTotal),isAll?'suma '+S.props.length+' obiektów':'w tym cukiernia '+fmt(T.cukSum));
    h+=kpiCard('Śniadania — goście','',T.bGuests+'',isAll?'':'koszt/os. '+fmt2(safeDiv(T.bCost,T.bGuests))+' zł');
    h+=kpiCard('Kolacje — goście','',T.dGuests+'',isAll?'':'koszt/os. '+fmt2(safeDiv(T.dCost,T.dGuests))+' zł');
    h+=kpiCard('Posiłków razem','',T.mealsTotal+'','śniadania + kolacje');
    h+=kpiCard('Dochód bufety (PLN)','warm',fmt(T.totalProfitPLN),'rentowność '+fmtPct(T.profitPct));
    h+='</div>';
  }

  if(w.rings){
    h+='<div class="grid2">';
    h+='<div class="chart-box"><div class="ring-wrap">'+
        ringSVG('fb',T.fbCostPct,'F&B COST',getCSSv('--violet'),getCSSv('--pink'))+
        '<div><div class="stitle" style="margin:0">F&B Cost narastająco</div>'+
        '<div class="page-sub">Koszt / przychód bufetowy total (śniadania+kolacje+cukiernia)</div>'+
        '<div style="margin-top:8px" class="badge '+(T.fbCostPct<=target?'up':'dn')+'">'+(T.fbCostPct<=target?'W normie (≤'+target+'%)':'Powyżej celu '+target+'%')+'</div></div>'+
      '</div></div>';
    h+='<div class="chart-box"><div class="ring-wrap">'+
        ringSVG('pf',Math.max(0,T.profitPct),'RENTOWNOŚĆ',getCSSv('--teal'),getCSSv('--violet'))+
        '<div><div class="stitle" style="margin:0">Rentowność posiłku</div>'+
        '<div class="page-sub">Dochód na posiłek: '+fmt2(T.incomePerMeal)+' zł</div>'+
        '<div style="margin-top:8px" class="page-sub">Śr. koszt obsługi: '+fmt2(T.avgServicePerMeal)+' zł/posiłek (wpisz w Analizie miesięcznej)</div></div>'+
      '</div></div>';
    h+='</div>';
  }

  if(w.trend)h+='<div class="chart-box"><div class="stitle">Przychód vs koszt — narastająco w miesiącu</div><canvas id="ch-trend" height="90"></canvas></div>';
  if(w.splitfbday){
    h+='<div class="grid2">';
    h+='<div class="chart-box"><div class="stitle">Śniadania vs Kolacje — udział w przychodzie</div><canvas id="ch-split"></canvas></div>';
    h+='<div class="chart-box"><div class="stitle">F&amp;B Cost % dziennie</div><canvas id="ch-fbday"></canvas></div>';
    h+='</div>';
  }
  return h;
}

  h+='<div><div class="stitle" style="margin:0 0 2px 0">📅 Dzisiaj — '+td+' '+mLabelFull(ty)+'</div>';
  h+='<div class="badge '+(filled?'up':'dn')+'">'+(filled?'✓ Dane wprowadzone':'✗ Brak danych na dziś')+'</div></div>';

function goToTodayEntry(){

function openDashPersonalize(){
  var w=getDashWidgets();

function chBadge(pct){

function getCSSv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

/* ═══════════════════════════════════════════════════════
   PWA: manifest + icon generated at runtime (no external assets needed)
═══════════════════════════════════════════════════════ */
function makeIconDataURL(size){
  var c=document.createElement('canvas');c.width=size;c.height=size;
  var ctx=c.getContext('2d');
  var g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#7c6cf0');g.addColorStop(.5,'#c866ea');g.addColorStop(1,'#ff6fa5');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#fff';ctx.font='bold '+(size*0.52)+'px Outfit,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('B',size/2,size*0.56);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    var icon192=makeIconDataURL(192),icon512=makeIconDataURL(512);
    document.getElementById('pwa-favicon').href=icon192;
    document.getElementById('pwa-apple-icon').href=icon192;
    var startUrl=location.pathname||'./';
    var scope=startUrl.substring(0,startUrl.lastIndexOf('/')+1)||'./';
    var manifest={
      id:'bufetcost-app',
      name:'BufetCost — F&B P&L Analytics',short_name:'BufetCost',
      description:'Analiza kosztów i przychodów bufetu hotelowego (śniadania, kolacje)',
      start_url:startUrl,scope:scope,display:'standalone',orientation:'portrait-primary',
      background_color:'#0d0b1f',theme_color:'#0d0b1f',lang:'pl',
      categories:['business','finance','productivity'],
      icons:[
        {src:icon192,sizes:'192x192',type:'image/png',purpose:'any'},
        {src:icon192,sizes:'192x192',type:'image/png',purpose:'maskable'},
        {src:icon512,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:icon512,sizes:'512x512',type:'image/png',purpose:'maskable'}
      ],
      shortcuts:[
        {name:'Wprowadź dzisiaj',short_name:'Wprowadź',url:'?action=entry',description:'Wprowadź dane bufetu na dziś'},
        {name:'Pulpit',short_name:'Pulpit',url:'?action=dashboard',description:'Otwórz pulpit analityczny'}
      ]
    };
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    document.getElementById('pwa-manifest').href=URL.createObjectURL(blob);
    registerSW();
  }catch(e){}
}
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  var swCode=[
    'const CV="bufetcost-v1";',
    'self.addEventListener("install",function(e){self.skipWaiting();});',
    'self.addEventListener("activate",function(e){',
    '  e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k!==CV}).map(function(k){return caches.delete(k)}))}).then(function(){return self.clients.claim()}));',
    '});',
    'self.addEventListener("fetch",function(e){',
    '  if(e.request.mode==="navigate"){',
    '    e.respondWith(fetch(e.request).then(function(r){var cl=r.clone();caches.open(CV).then(function(c){c.put(e.request,cl)});return r}).catch(function(){return caches.match(e.request)}));',
    '    return;',
    '  }',
    '  e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(res){var cl=res.clone();caches.open(CV).then(function(c){c.put(e.request,cl)});return res}).catch(function(){return r})}));',
    '});'
  ].join('\n');
  var blob=new Blob([swCode],{type:'application/javascript'});
  var swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(function(reg){
    console.log('[PWA] Service Worker zarejestrowany, scope:',reg.scope);
  }).catch(function(err){
    console.log('[PWA] Rejestracja Service Workera nieudana:',err.message);
  });
}

/* ═══ RING helper (signature visual) ═══ */
function ringSVG(id,pct,label,colorFrom,colorTo){
  pct=Math.max(0,Math.min(100,pct||0));
  var r=42,c=2*Math.PI*r,off=c-(pct/100)*c;
  var gid='rg-'+id;
  return '<div class="ring">'+
    '<svg viewBox="0 0 100 100">'+
      '<defs><linearGradient id="'+gid+'" x1="0%" y1="0%" x2="100%" y2="100%">'+
        '<stop offset="0%" stop-color="'+colorFrom+'"/><stop offset="100%" stop-color="'+colorTo+'"/>'+
      '</linearGradient></defs>'+
      '<circle class="ring-bg" cx="50" cy="50" r="'+r+'"/>'+
      '<circle class="ring-fg" cx="50" cy="50" r="'+r+'" stroke="url(#'+gid+')" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'+
    '</svg>'+
    '<div class="ring-val"><b>'+(isFinite(pct)?pct.toFixed(1):'0.0')+'%</b><span>'+label+'</span></div>'+
  '</div>';
}
